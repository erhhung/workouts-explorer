server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-b/Mj2y/nO8JVgfcZBrtey+zfRTYCU35oNGyRFE7HvQM='; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health/live {
        access_log off;
        return 200 "ok\n";
    }

    location = /health/ready {
        access_log off;
        try_files /index.html =503;
    }
}
