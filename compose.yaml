services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: workouts
      POSTGRES_USER: workouts_migration
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workouts_migration -d workouts"]
      interval: 2s
      timeout: 2s
      retries: 20
