apiVersion: batch/v1
kind: Job
metadata:
  name: osm-update-${OSM_JOB_SUFFIX}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: osm-update
    spec:
      restartPolicy: Never
      hostAliases:
        - ip: "${OSM_PROMETHEUS_SERVICE_IP}"
          hostnames:
            - prometheus-stack-prometheus.monitoring.svc.cluster.local
      imagePullSecrets:
        - name: ${OSM_IMAGE_PULL_SECRET}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: osm-update
          image: ${OSM_UPDATE_IMAGE}
          imagePullPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - >-
              test -f /app/osm-operator-v1 || {
                echo 'OSM update image does not support operator actions' >&2;
                exit 1;
              };
              exec /app/osm-update
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: OSM_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${OSM_DATABASE_SECRET}
                  key: ${OSM_DATABASE_KEY}
            - name: OSM_REGION_ID
              value: "${OSM_REGION_ID}"
            - name: TZ
              value: America/Los_Angeles
            - name: OSM_LOG_TIMEZONE
              value: America/Los_Angeles
            - name: OSM_UPDATE_ACTION
              value: "${OSM_UPDATE_ACTION}"
            - name: OSM_GENERATION_ID
              value: "${OSM_GENERATION_ID}"
            - name: OSM_OPERATOR
              value: "${OSM_OPERATOR}"
            - name: OSM_OPERATOR_NOTE
              value: "${OSM_OPERATOR_NOTE}"
            - name: OSM_ABORT_REASON
              value: "${OSM_ABORT_REASON}"
            - name: OSM_MAX_DOWNLOAD_BYTES
              value: "${OSM_MAX_DOWNLOAD_BYTES}"
            - name: OSM_RESUME_GENERATION_ID
              value: "${OSM_RESUME_GENERATION_ID}"
            - name: OSM_UPDATE_SCRATCH
              value: /scratch
            - name: OSM_PIPELINE_ROOT
              value: /app/osm
            - name: OSM_PROMETHEUS_URL
              value: "https://prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            - name: SSL_CERT_FILE
              value: /tls/prod-db/ca.crt
            - name: OSM_PROMETHEUS_PVC_TEMPLATE
              value: "data-{{POD}}"
            - name: OSM_PROMETHEUS_MAX_SAMPLE_AGE
              value: "2m"
          resources:
            requests:
              cpu: "${OSM_RESOURCE_REQUEST_CPU}"
              memory: "${OSM_RESOURCE_REQUEST_MEMORY}"
              ephemeral-storage: "${OSM_RESOURCE_REQUEST_EPHEMERAL_STORAGE}"
            limits:
              cpu: "${OSM_RESOURCE_LIMIT_CPU}"
              memory: "${OSM_RESOURCE_LIMIT_MEMORY}"
              ephemeral-storage: "${OSM_RESOURCE_LIMIT_EPHEMERAL_STORAGE}"
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: database-tls
              mountPath: /tls/prod-db
              readOnly: true
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
        - name: database-tls
          secret:
            secretName: ${OSM_DATABASE_TLS_SECRET}
            defaultMode: 0440
