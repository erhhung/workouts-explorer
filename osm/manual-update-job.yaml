# Operator-rendered wrapper for the standalone /app/osm-update CLI. The managed
# controller renders its own osm-region-* Jobs and injects execution capabilities.
apiVersion: batch/v1
kind: Job
metadata:
  name: osm-update-${OSM_JOB_SUFFIX}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: osm-update
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      hostAliases: ${OSM_PROMETHEUS_HOST_ALIASES}
      imagePullSecrets:
        - name: ${OSM_IMAGE_PULL_SECRET}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: osm-update
          image: ${OSM_UPDATE_IMAGE}
          imagePullPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - >-
              test -f /app/osm-operator-v1 || {
                echo 'OSM update image does not support operator actions' >&2;
                exit 1;
              };
              exec /app/osm-update
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: OSM_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${OSM_DATABASE_SECRET}
                  key: ${OSM_DATABASE_KEY}
            - name: OSM_REGION_ID
              value: "${OSM_REGION_ID}"
            - name: TZ
              value: America/Los_Angeles
            - name: OSM_LOG_TIMEZONE
              value: America/Los_Angeles
            - name: OSM_UPDATE_ACTION
              value: "${OSM_UPDATE_ACTION}"
            - name: OSM_GENERATION_ID
              value: "${OSM_GENERATION_ID}"
            - name: OSM_BUILD_ID
              value: "${OSM_BUILD_ID}"
            - name: OSM_OPERATOR
              value: "${OSM_OPERATOR}"
            - name: OSM_OPERATOR_NOTE
              value: "${OSM_OPERATOR_NOTE}"
            - name: OSM_ABORT_REASON
              value: "${OSM_ABORT_REASON}"
            - name: OSM_MAX_DOWNLOAD_BYTES
              value: "${OSM_MAX_DOWNLOAD_BYTES}"
            - name: OSM_RESUME_GENERATION_ID
              value: "${OSM_RESUME_GENERATION_ID}"
            - name: OSM_RESUME_BUILD_ID
              value: "${OSM_RESUME_BUILD_ID}"
            - name: OSM_MONITOR_DATABASE_STORAGE
              value: "${OSM_MONITOR_DATABASE_STORAGE}"
            - name: OSM_STORAGE_SETTLE_TIMEOUT
              value: "${OSM_STORAGE_SETTLE_TIMEOUT}"
            - name: OSM_UPDATE_SCRATCH
              value: /scratch
            - name: OSM_PIPELINE_ROOT
              value: /app/osm
            - name: OSM_PROMETHEUS_URL
              value: "${OSM_PROMETHEUS_URL}"
            - name: OSM_STORAGE_METRICS_ENABLED
              value: "${OSM_STORAGE_METRICS_ENABLED}"
            - name: OSM_STORAGE_AVAILABLE_METRIC
              value: "${OSM_STORAGE_AVAILABLE_METRIC}"
            - name: OSM_STORAGE_CAPACITY_METRIC
              value: "${OSM_STORAGE_CAPACITY_METRIC}"
            - name: OSM_STORAGE_SELECTOR_LABELS_JSON
              value: >-
                ${OSM_STORAGE_SELECTOR_LABELS_JSON}
            - name: SSL_CERT_FILE
              value: /tls/prod-db/ca.crt
            - name: OSM_PROMETHEUS_MAX_SAMPLE_AGE
              value: "2m"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: "${OSM_RESOURCE_REQUEST_EPHEMERAL_STORAGE}"
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: "${OSM_RESOURCE_LIMIT_EPHEMERAL_STORAGE}"
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: database-tls
              mountPath: /tls/prod-db
              readOnly: true
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
        - name: database-tls
          secret:
            secretName: ${OSM_DATABASE_TLS_SECRET}
            defaultMode: 0440
