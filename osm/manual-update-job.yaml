apiVersion: batch/v1
kind: Job
metadata:
  name: osm-update-${OSM_JOB_SUFFIX}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: osm-update
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ${OSM_IMAGE_PULL_SECRET}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: osm-update
          image: ${OSM_UPDATE_IMAGE}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: OSM_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${OSM_DATABASE_SECRET}
                  key: ${OSM_DATABASE_KEY}
            - name: OSM_REGION_ID
              value: "${OSM_REGION_ID}"
            - name: OSM_MAX_DOWNLOAD_BYTES
              value: "${OSM_MAX_DOWNLOAD_BYTES}"
            - name: OSM_UPDATE_SCRATCH
              value: /scratch
            - name: OSM_PIPELINE_ROOT
              value: /app/osm
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 8Gi
          volumeMounts:
            - name: scratch
              mountPath: /scratch
            - name: database-tls
              mountPath: /tls/prod-db
              readOnly: true
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
        - name: database-tls
          secret:
            secretName: ${OSM_DATABASE_TLS_SECRET}
            defaultMode: 0440
