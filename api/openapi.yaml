openapi: 3.0.3
info:
  title: Workouts Explorer API
  version: 0.3.0
  description: Design-first API for account lifecycle, sources, ingest, and workouts.
servers:
  - url: /
paths:
  /api/config:
    get:
      operationId: getPublicConfig
      description: >-
        Returns non-secret browser runtime settings. No authentication or input parameters are required.
      tags: [public]
      responses:
        '200': {description: Safe browser configuration, content: {application/json: {schema: {$ref: '#/components/schemas/PublicConfig'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/openapi.yaml:
    get:
      operationId: getOpenAPIDocument
      description: >-
        Returns this public OpenAPI 3.0.3 document as YAML. No authentication or input parameters are required.
      tags: [public]
      responses:
        '200': {description: OpenAPI YAML, content: {application/yaml: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/Problem'}
  /swagger:
    get:
      operationId: getSwaggerUI
      description: >-
        Serves the public interactive API documentation. Invoking protected operations still requires their normal authentication.
      tags: [public]
      responses:
        '200': {description: Swagger UI, content: {text/html: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /health/live:
    get:
      operationId: getLiveness
      description: >-
        Reports whether the API process is alive. This probe requires no authentication and does not depend on downstream services.
      tags: [health]
      responses:
        '200': {description: Live, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
  /health/ready:
    get:
      operationId: getReadiness
      description: >-
        Reports whether the API and required application database schema are ready to serve traffic. No authentication is required.
      tags: [health]
      responses:
        '200': {description: Ready, content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}
        '503': {$ref: '#/components/responses/Problem'}
  /api/session:
    post:
      operationId: createBrowserSession
      description: >-
        Authenticates a local identity and creates a revocable browser session. The JSON body is required and must contain username or email in `username` plus `password`.
      tags: [session]
      requestBody: {$ref: '#/components/requestBodies/Signin'}
      responses:
        '201': {description: Cookie session created, headers: {Set-Cookie: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/BrowserSession'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
    get:
      operationId: getCurrentSession
      description: >-
        Returns metadata for the authenticated, unexpired current session. A bearer token or browser session cookie is required.
      tags: [session]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Current session, content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/BrowserSession'}, {$ref: '#/components/schemas/SessionMetadata'}]}}}}
        '401': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteCurrentSession
      description: >-
        Revokes the authenticated current session. Cookie-authenticated requests require `X-CSRF-Token`; bearer-authenticated requests do not.
      tags: [session]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/session-tokens:
    post:
      operationId: createSessionToken
      description: >-
        Authenticates a local identity and creates a revocable opaque bearer session. The JSON body is required and must contain username or email in `username` plus `password`.
      tags: [session]
      requestBody: {$ref: '#/components/requestBodies/Signin'}
      responses:
        '201': {description: Bearer session created, content: {application/json: {schema: {$ref: '#/components/schemas/TokenSession'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/admin/invitations:
    post:
      operationId: createInvitation
      description: >-
        Administrator-only operation that creates and emails a single-use invitation. The JSON body and unique `email` are required; cookie authentication also requires `X-CSRF-Token`.
      tags: [administration]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationCreate'}}}
      responses:
        '201': {description: Invitation delivered, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/invitations/{token}:
    get:
      operationId: getInvitation
      description: >-
        Resolves a pending public invitation without exposing its stored verifier. The single-use invitation `token` path parameter is required.
      tags: [public]
      parameters: [{$ref: '#/components/parameters/Token'}]
      responses:
        '200': {description: Valid invitation, content: {application/json: {schema: {$ref: '#/components/schemas/PublicInvitation'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/registrations:
    post:
      operationId: createRegistration
      description: >-
        Atomically consumes an invitation and creates one private owner account. The required JSON body contains `token`, `username`, `fullName`, `password`, and matching `passwordConfirmation`.
      tags: [public]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationCreate'}}}
      responses:
        '201': {description: Account created, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/password-reset-requests:
    post:
      operationId: createPasswordResetRequest
      description: >-
        Accepts an enumeration-resistant password-recovery request. The required JSON body contains `username`, which may be a username or email address.
      tags: [public]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetRequest'}}}
      responses:
        '202': {description: Request accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Accepted'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/password-resets:
    post:
      operationId: createPasswordReset
      description: >-
        Consumes a valid reset token, replaces the password, and revokes existing sessions. The required JSON body contains `token`, `password`, and matching `passwordConfirmation`.
      tags: [public]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PasswordResetCreate'}}}
      responses:
        '204': {description: Password replaced and sessions revoked}
        '400': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/me:
    get:
      operationId: getMe
      description: >-
        Returns the authenticated data owner's personal profile. A bearer token or browser session cookie is required.
      tags: [account]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Personal profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMe
      description: >-
        Updates supplied mutable profile fields for the authenticated owner. A non-empty JSON body is required; cookie authentication also requires `X-CSRF-Token`.
      tags: [account]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProfilePatch'}}}
      responses:
        '200': {description: Updated profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/me/preferences:
    get:
      operationId: getMyPreferences
      description: >-
        Returns the authenticated owner's persisted display, date-range, and pagination preferences. No query parameters are required.
      tags: [account]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Preferences, content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMyPreferences
      description: >-
        Partially updates supplied owner preferences while retaining omitted values. A non-empty JSON body is required; cookie authentication also requires `X-CSRF-Token`.
      tags: [account]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PreferencesPatch'}}}
      responses:
        '200': {description: Updated preferences, content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/me/avatar:
    get:
      operationId: getMyAvatar
      description: >-
        Returns a privacy-proxied avatar or generated fallback for the authenticated identity. Conditional requests may supply standard cache validators.
      tags: [account]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Privacy-proxied avatar or generated fallback, headers: {Cache-Control: {schema: {type: string}}, ETag: {schema: {type: string}}}, content: {image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}, image/webp: {schema: {type: string, format: binary}}, image/svg+xml: {schema: {type: string, format: binary}}}}
        '304': {description: Not modified}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/sources:
    get:
      operationId: listSources
      description: >-
        Lists non-deleted sources owned by the authenticated account with safe configuration and connection state. No query parameters are required.
      tags: [sources]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Current data sources, content: {application/json: {schema: {$ref: '#/components/schemas/SourceList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    post:
      operationId: createSource
      description: >-
        Creates an owned source and queues its asynchronous connection check. The required JSON body contains `displayName`, immutable `type`, `autoSyncEnabled`, and type-specific `config`; cookie authentication requires `X-CSRF-Token`.
      tags: [sources]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SourceCreate'}}}
      responses:
        '201': {description: Source created and connection check queued, headers: {Location: {schema: {type: string, format: uri-reference}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/sources/{sourceId}:
    parameters: [{$ref: '#/components/parameters/SourceID'}]
    get:
      operationId: getSource
      description: >-
        Returns one current source owned by the authenticated account without encrypted configuration or secrets. The `sourceId` path parameter is required.
      tags: [sources]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Current data source, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateSource
      description: >-
        Partially updates an owned source; changing adapter configuration increments its generation and queues a new connection check. `sourceId` and a non-empty JSON body are required; cookie authentication requires `X-CSRF-Token`.
      tags: [sources]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SourcePatch'}}}
      responses:
        '200': {description: Source updated, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteSource
      description: >-
        Deletes an owned source, clears current credentials, and cancels affected ingest work while preserving imported workout provenance. `sourceId` is required; cookie authentication also requires `X-CSRF-Token`.
      tags: [sources]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Source deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/ingest:
    post:
      operationId: createIngest
      description: >-
        Queues or reuses a manual ingest parent for 1-100 required unique `sourceIds`. Optional `startDate` and `endDate` must be supplied together as an inclusive range; cookie authentication requires `X-CSRF-Token`.
      tags: [ingest]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IngestCreate'}}}
      responses:
        '202': {description: Manual ingest queued, headers: {Location: {required: true, schema: {type: string, pattern: '^/api/jobs/[0-9A-F]{32}$'}}}, content: {application/json: {schema: {$ref: '#/components/schemas/IngestAccepted'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/jobs:
    get:
      operationId: listJobs
      description: >-
        Lists paginated owner-visible top-level sync and workout-deletion tasks. Optional `page`, `pageSize`, `operation`, and `status` filters constrain the result; internal source checks and per-source child jobs are excluded.
      tags: [jobs]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/JobStatus'}}
        - {name: operation, in: query, schema: {type: string, enum: [manual_sync, automated_sync, workout_deletion]}}
      responses:
        '200': {description: Top-level task history, content: {application/json: {schema: {$ref: '#/components/schemas/JobList'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/jobs/{jobId}:
    parameters: [{$ref: '#/components/parameters/JobID'}]
    get:
      operationId: getJob
      description: >-
        Returns security-redacted detail, progress, hierarchy, and retry lineage for one owned job. The `jobId` path parameter is required.
      tags: [jobs]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Safe owner job detail, content: {application/json: {schema: {$ref: '#/components/schemas/JobDetail'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/jobs/{jobId}/cancellation:
    parameters: [{$ref: '#/components/parameters/JobID'}]
    post:
      operationId: createJobCancellation
      description: >-
        Requests cancellation of an owned non-terminal job; running work stops cooperatively at a safe boundary. `jobId` and an empty JSON object are required; cookie authentication requires `X-CSRF-Token`.
      tags: [jobs]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JobCancellationCreate'}}}
      responses:
        '200': {description: Cancellation requested, content: {application/json: {schema: {$ref: '#/components/schemas/JobDetail'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/jobs/{jobId}/retry:
    parameters: [{$ref: '#/components/parameters/JobID'}]
    post:
      operationId: createJobRetry
      description: >-
        Creates a linked retry for eligible owned failed or cancelled ingest/deletion work without requeuing the original job. `jobId` and an empty JSON object are required; cookie authentication requires `X-CSRF-Token`.
      tags: [jobs]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EmptyCreate'}}}
      responses:
        '202': {description: Retry queued, headers: {Location: {required: true, schema: {type: string, pattern: '^/api/jobs/[0-9A-F]{32}$'}}}, content: {application/json: {schema: {$ref: '#/components/schemas/IngestAccepted'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/jobs/{jobId}/files:
    parameters: [{$ref: '#/components/parameters/JobID'}]
    get:
      operationId: listJobFiles
      description: >-
        Lists paginated, redacted file-processing results for an owned ingest job. `jobId` is required; optional `page` and `pageSize` control pagination.
      tags: [jobs]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Safe ingest file results, content: {application/json: {schema: {$ref: '#/components/schemas/JobFileList'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/jobs/{jobId}/events:
    parameters: [{$ref: '#/components/parameters/JobID'}]
    get:
      operationId: listJobEvents
      description: >-
        Lists paginated safe structured events for an owned job. `jobId` is required; optional `page` and `pageSize` control pagination.
      tags: [jobs]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Safe job events, content: {application/json: {schema: {$ref: '#/components/schemas/JobEventList'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/jobs/{jobId}/logs:
    parameters: [{$ref: '#/components/parameters/JobID'}]
    get:
      operationId: listJobLogs
      description: >-
        Lists paginated security-redacted diagnostics for an owned job. `jobId` is required; optional `page` and `pageSize` control pagination.
      tags: [jobs]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200': {description: Redacted job diagnostics, content: {application/json: {schema: {$ref: '#/components/schemas/JobLogList'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/data-sync:
    get:
      operationId: getDataSync
      description: >-
        Returns the authenticated owner's synchronization schedule, source freshness, active/latest work, and bounded notifications. No query parameters are required.
      tags: [data-sync]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Owner data synchronization snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/DataSync'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/notifications:
    get:
      operationId: listNotifications
      description: >-
        Lists paginated notifications owned by the authenticated user. Optional `page`, `pageSize`, and server-owned `state` filters constrain the result.
      tags: [notifications]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {name: state, in: query, schema: {$ref: '#/components/schemas/NotificationState'}}
      responses:
        '200': {description: Owner notifications, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationList'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/notifications/{notificationId}/dismissal:
    parameters: [{$ref: '#/components/parameters/NotificationID'}]
    post:
      operationId: createNotificationDismissal
      description: >-
        Requests server-controlled dismissal or reminder handling for one owned notification. `notificationId` and an empty JSON object are required; cookie authentication requires `X-CSRF-Token`.
      tags: [notifications]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EmptyCreate'}}}
      responses:
        '200': {description: Notification state updated, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/workouts:
    get:
      operationId: listWorkouts
      description: >-
        Lists paginated, non-hidden owned workouts in an inclusive local-start-date range. A date selector is required: supply either both `startDate` and `endDate` or `dateRangeEnum`, never both forms; optional `tz`, `page`, `pageSize`, and allowlisted `sort` terms refine the result.
      tags: [workouts]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/StartDate'}
        - {$ref: '#/components/parameters/EndDate'}
        - {$ref: '#/components/parameters/DateRangeEnum'}
        - {$ref: '#/components/parameters/Timezone'}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1}}
        - {name: sort, in: query, style: form, explode: true, schema: {type: array, maxItems: 8, items: {type: string, pattern: '^(date|type|duration|distance|pace|calories|heartRate|elevation):(asc|desc)$'}}}
      responses:
        '200': {description: Account workouts in the resolved date range, content: {application/json: {schema: {$ref: '#/components/schemas/WorkoutList'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: deleteWorkoutRange
      description: >-
        Captures and immediately hides the fixed set of owned workouts in a required inclusive `startDate`/`endDate` range, then queues durable deletion. Cookie authentication also requires `X-CSRF-Token`.
      tags: [workouts]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - {$ref: '#/components/parameters/RequiredStartDate'}
        - {$ref: '#/components/parameters/RequiredEndDate'}
      responses:
        '202':
          description: Durable explicit-range workout deletion accepted and logically hidden
          headers:
            Location: {required: true, schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/WorkoutDeletionAccepted'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/workouts/{workoutId}/provenance:
    parameters: [{$ref: '#/components/parameters/WorkoutID'}]
    get:
      operationId: getWorkoutProvenance
      description: >-
        Returns complete chronological sanitized import provenance for one owned, visible workout. The tolerant compact-or-dashed `workoutId` path parameter is required.
      tags: [workouts]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Full chronological import provenance for an owned workout, content: {application/json: {schema: {$ref: '#/components/schemas/WorkoutProvenance'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/workouts/{workoutId}:
    parameters: [{$ref: '#/components/parameters/WorkoutID'}]
    delete:
      operationId: deleteWorkout
      description: >-
        Immediately hides one owned workout and queues durable physical and derived-data cleanup. The `workoutId` path parameter is required; cookie authentication also requires `X-CSRF-Token`.
      tags: [workouts]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '202':
          description: Durable workout deletion accepted and logically hidden
          headers:
            Location: {required: true, schema: {type: string}}
          content: {application/json: {schema: {$ref: '#/components/schemas/WorkoutDeletionAccepted'}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/workouts/{workoutId}/route/points:
    parameters: [{$ref: '#/components/parameters/WorkoutID'}]
    get:
      operationId: exportWorkoutPoints
      description: >-
        Downloads schema-versioned normalized route points in provider sequence for one owned, visible workout. The `workoutId` path parameter is required; workouts without an exportable route return conflict.
      tags: [workouts]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Complete normalized route points in provider order
          headers:
            Content-Disposition:
              required: true
              schema: {type: string, pattern: '^attachment; filename="[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.json"$'}
          content:
            application/json: {schema: {$ref: '#/components/schemas/WorkoutPointsExport'}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/workouts/{workoutId}/route:
    parameters: [{$ref: '#/components/parameters/WorkoutID'}]
    get:
      operationId: exportWorkoutGeoJSON
      description: >-
        Downloads one contextual GeoJSON LineString for a required owned `workoutId`, using consistently 3D coordinates only when every point has altitude and otherwise 2D. Workouts without a usable route return conflict.
      tags: [workouts]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200':
          description: Standard GeoJSON Feature containing one contextual workout LineString
          headers:
            Content-Disposition:
              required: true
              schema: {type: string, pattern: '^attachment; filename="[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.geojson"$'}
          content:
            application/geo+json: {schema: {$ref: '#/components/schemas/WorkoutGeoJSONFeature'}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/workout-types:
    get:
      operationId: listWorkoutTypes
      description: >-
        Lists normalized workout types currently present for the authenticated account. No query parameters are required.
      tags: [workouts]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      responses:
        '200': {description: Current account workout types, content: {application/json: {schema: {$ref: '#/components/schemas/WorkoutTypeList'}}}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /api/summary:
    get:
      operationId: getWorkoutSummary
      description: >-
        Returns owned workout totals and per-type breakdowns for an inclusive local-start-date range. A date selector is required: supply either both `startDate` and `endDate` or `dateRangeEnum`, never both forms; optional `tz` affects shortcut resolution.
      tags: [workouts]
      security: [{bearerAuth: []}, {cookieAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/StartDate'}
        - {$ref: '#/components/parameters/EndDate'}
        - {$ref: '#/components/parameters/DateRangeEnum'}
        - {$ref: '#/components/parameters/Timezone'}
      responses:
        '200': {description: Account workout totals in the resolved date range, content: {application/json: {schema: {$ref: '#/components/schemas/WorkoutSummary'}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque}
    cookieAuth: {type: apiKey, in: cookie, name: workouts_session}
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema: {type: string}
    Token:
      name: token
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueToken'}
    SourceID:
      name: sourceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CompactUUID'}
    JobID:
      name: jobId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CompactUUID'}
    NotificationID:
      name: notificationId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CompactUUID'}
    WorkoutID:
      name: workoutId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUIDInput'}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    StartDate:
      name: startDate
      in: query
      schema: {type: string, format: date}
    RequiredStartDate:
      name: startDate
      in: query
      required: true
      schema: {type: string, format: date}
    EndDate:
      name: endDate
      in: query
      schema: {type: string, format: date}
    RequiredEndDate:
      name: endDate
      in: query
      required: true
      schema: {type: string, format: date}
    DateRangeEnum:
      name: dateRangeEnum
      in: query
      schema: {$ref: '#/components/schemas/DateRangeEnum'}
    Timezone:
      name: tz
      in: query
      schema: {type: string, minLength: 1, maxLength: 255}
  requestBodies:
    Signin:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/SigninRequest'}}}
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    RateLimited:
      description: The shared authentication rate limit was exceeded
      headers:
        Retry-After: {required: true, schema: {type: integer, minimum: 1}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    PublicConfig:
      type: object
      additionalProperties: false
      required: [productName, pollingIntervalSeconds, mapFitPaddingPixels, passwordMinimumLength, pageSizeMaximum]
      properties:
        productName: {type: string}
        pollingIntervalSeconds: {type: integer, minimum: 1, maximum: 3600}
        mapFitPaddingPixels: {type: integer, minimum: 0, maximum: 512}
        passwordMinimumLength: {type: integer, minimum: 12, maximum: 64}
        pageSizeMaximum: {type: integer, minimum: 25, maximum: 1000}
        baseMapTileUrl: {type: string, format: uri-template}
        baseMapAttribution: {type: string, maxLength: 1024}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties: {status: {type: string, enum: [ok]}}
    SigninRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 254}
        password: {type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true}
    IdentitySummary:
      type: object
      additionalProperties: false
      required: [id, username, fullName, role]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        username: {type: string}
        fullName: {type: string}
        role: {type: string, enum: [administrator, user]}
    SessionMetadata:
      type: object
      additionalProperties: false
      required: [id, identity, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        identity: {$ref: '#/components/schemas/IdentitySummary'}
        expiresAt: {type: string, format: date-time}
    BrowserSession:
      type: object
      additionalProperties: false
      required: [id, identity, expiresAt, csrfToken]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        identity: {$ref: '#/components/schemas/IdentitySummary'}
        expiresAt: {type: string, format: date-time}
        csrfToken: {$ref: '#/components/schemas/OpaqueToken'}
    TokenSession:
      type: object
      additionalProperties: false
      required: [id, identity, expiresAt, accessToken, tokenType]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        identity: {$ref: '#/components/schemas/IdentitySummary'}
        expiresAt: {type: string, format: date-time}
        accessToken: {$ref: '#/components/schemas/OpaqueToken'}
        tokenType: {type: string, enum: [Bearer]}
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties: {email: {type: string, minLength: 3, maxLength: 254}}
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, state, deliveryState, issuedAt, expiresAt]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        email: {type: string}
        state: {type: string, enum: [pending, accepted, revoked, expired]}
        deliveryState: {type: string, enum: [pending, delivered, failed, unknown]}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    PublicInvitation:
      type: object
      additionalProperties: false
      required: [email, expiresAt]
      properties: {email: {type: string}, expiresAt: {type: string, format: date-time}}
    RegistrationCreate:
      type: object
      additionalProperties: false
      required: [token, username, fullName, password, passwordConfirmation]
      properties:
        token: {$ref: '#/components/schemas/OpaqueToken'}
        username: {type: string, minLength: 1, maxLength: 128}
        fullName: {type: string, minLength: 1, maxLength: 200}
        password: {type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true}
        passwordConfirmation: {type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true}
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties: {username: {type: string, minLength: 1, maxLength: 254, description: Username or email}}
    PasswordResetCreate:
      type: object
      additionalProperties: false
      required: [token, password, passwordConfirmation]
      properties:
        token: {$ref: '#/components/schemas/OpaqueToken'}
        password: {type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true}
        passwordConfirmation: {type: string, format: password, minLength: 1, maxLength: 512, writeOnly: true}
    Accepted:
      type: object
      additionalProperties: false
      required: [status]
      properties: {status: {type: string, enum: [accepted]}}
    Profile:
      type: object
      additionalProperties: false
      required: [id, username, email, fullName]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        username: {type: string, readOnly: true}
        email: {type: string, readOnly: true}
        fullName: {type: string}
        avatarUrl: {type: string, enum: [/api/me/avatar], readOnly: true}
    ProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties: {fullName: {type: string, minLength: 1, maxLength: 200}}
    Preferences:
      type: object
      additionalProperties: false
      required: [theme, units, timezone, firstWeekday, clockFormat, workoutColumns, pageSize]
      properties:
        theme: {type: string, enum: [dark, light]}
        units: {type: string, enum: [imperial, metric]}
        timezone: {type: string, minLength: 1, maxLength: 64}
        firstWeekday: {type: string, enum: [monday, sunday]}
        clockFormat: {type: string, enum: [12h, 24h]}
        workoutColumns: {type: array, uniqueItems: true, maxItems: 12, items: {type: string, enum: [date, type, duration, distance, pace, calories, heartRate, elevation]}}
        pageSize: {type: integer, minimum: 10}
        dateRange: {$ref: '#/components/schemas/DateRangePreference'}
    PreferencesPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme: {type: string, enum: [dark, light]}
        units: {type: string, enum: [imperial, metric]}
        timezone: {type: string, minLength: 1, maxLength: 64}
        firstWeekday: {type: string, enum: [monday, sunday]}
        clockFormat: {type: string, enum: [12h, 24h]}
        workoutColumns: {type: array, uniqueItems: true, maxItems: 12, items: {type: string, enum: [date, type, duration, distance, pace, calories, heartRate, elevation]}}
        pageSize: {type: integer, minimum: 10}
        dateRange: {$ref: '#/components/schemas/DateRangePreference'}
    HealthAutoExportLocalConfig:
      type: object
      additionalProperties: false
      required: [version, path]
      properties:
        version: {type: integer, enum: [1]}
        path: {type: string, minLength: 1, maxLength: 4096}
    SourceCreate:
      oneOf:
        - {$ref: '#/components/schemas/HealthAutoExportLocalSourceCreate'}
      discriminator:
        propertyName: type
        mapping:
          health-auto-export-local: '#/components/schemas/HealthAutoExportLocalSourceCreate'
    HealthAutoExportLocalSourceCreate:
      type: object
      additionalProperties: false
      required: [displayName, type, autoSyncEnabled, config]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 200}
        type: {type: string, enum: [health-auto-export-local]}
        autoSyncEnabled: {type: boolean}
        config: {$ref: '#/components/schemas/HealthAutoExportLocalConfig'}
    SourcePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 200}
        autoSyncEnabled: {type: boolean}
        config: {$ref: '#/components/schemas/HealthAutoExportLocalConfig'}
    Source:
      type: object
      additionalProperties: false
      required: [id, displayName, type, autoSyncEnabled, status, generation, config, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        displayName: {type: string}
        type: {type: string, enum: [health-auto-export-local]}
        autoSyncEnabled: {type: boolean}
        status: {type: string, enum: [checking-connection, connected, connection-failed], x-enum-varnames: [CheckingConnection, Connected, ConnectionFailed]}
        generation: {type: integer, format: int64, minimum: 1}
        config: {$ref: '#/components/schemas/HealthAutoExportLocalConfig'}
        statusCode: {type: string, maxLength: 64}
        statusSummary: {type: string, maxLength: 512}
        checkedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Source'}}
    IngestCreate:
      type: object
      additionalProperties: false
      required: [sourceIds]
      properties:
        sourceIds: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/CompactUUID'}}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
    IngestAccepted:
      type: object
      additionalProperties: false
      required: [jobId, status, reused]
      properties:
        jobId: {$ref: '#/components/schemas/CompactUUID'}
        status: {type: string, enum: [queued, running]}
        reused: {type: boolean}
    JobStatus:
      type: string
      enum: [queued, running, succeeded, partially_succeeded, failed, cancelled]
    JobTrigger:
      type: string
      enum: [manual, scheduled]
    JobProgress:
      type: object
      additionalProperties: false
      required: [current, total, filesDiscovered, filesSkipped, filesSucceeded, filesFailed, workoutsCreated, workoutsUpdated, workoutsUnchanged, workoutsRejected]
      properties:
        current: {type: integer, format: int64, minimum: 0}
        total: {type: integer, format: int64, minimum: 0}
        filesDiscovered: {type: integer, format: int64, minimum: 0}
        filesSkipped: {type: integer, format: int64, minimum: 0}
        filesSucceeded: {type: integer, format: int64, minimum: 0}
        filesFailed: {type: integer, format: int64, minimum: 0}
        workoutsCreated: {type: integer, format: int64, minimum: 0}
        workoutsUpdated: {type: integer, format: int64, minimum: 0}
        workoutsUnchanged: {type: integer, format: int64, minimum: 0}
        workoutsRejected: {type: integer, format: int64, minimum: 0}
    JobSourceContext:
      type: object
      additionalProperties: false
      required: [sourceId, generation, displayName, sourceType]
      properties:
        sourceId: {$ref: '#/components/schemas/CompactUUID'}
        generation: {type: integer, format: int64, minimum: 1}
        displayName: {type: string, minLength: 1, maxLength: 200}
        sourceType: {type: string, minLength: 1, maxLength: 64}
    JobSummary:
      type: object
      additionalProperties: false
      required: [id, trigger, status, progress, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        operation: {type: string, enum: [data_sync, workout_deletion]}
        trigger: {$ref: '#/components/schemas/JobTrigger'}
        status: {$ref: '#/components/schemas/JobStatus'}
        progress: {$ref: '#/components/schemas/JobProgress'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        terminalAt: {type: string, format: date-time}
    JobDetail:
      type: object
      additionalProperties: false
      required: [id, trigger, status, attempt, progress, children, retriedByJobIds, createdAt, updatedAt, cancelRequested]
      properties:
        id: {$ref: '#/components/schemas/CompactUUID'}
        operation: {type: string, enum: [data_sync, workout_deletion]}
        parentJobId: {$ref: '#/components/schemas/CompactUUID'}
        trigger: {$ref: '#/components/schemas/JobTrigger'}
        status: {$ref: '#/components/schemas/JobStatus'}
        attempt: {type: integer, minimum: 0}
        progress: {$ref: '#/components/schemas/JobProgress'}
        source: {$ref: '#/components/schemas/JobSourceContext'}
        children: {type: array, items: {$ref: '#/components/schemas/JobDetail'}}
        results: {type: object, additionalProperties: false, properties: {filesSucceeded: {type: integer, format: int64, minimum: 0}, filesFailed: {type: integer, format: int64, minimum: 0}, workoutsCreated: {type: integer, format: int64, minimum: 0}, workoutsUpdated: {type: integer, format: int64, minimum: 0}, workoutsUnchanged: {type: integer, format: int64, minimum: 0}, workoutsRejected: {type: integer, format: int64, minimum: 0}}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        terminalAt: {type: string, format: date-time}
        failureCode: {type: string, maxLength: 64}
        failureSummary: {type: string, maxLength: 512}
        cancelRequested: {type: boolean}
        cancelRequestedAt: {type: string, format: date-time}
        retryOfJobId: {$ref: '#/components/schemas/CompactUUID'}
        retryRootJobId: {$ref: '#/components/schemas/CompactUUID'}
        retryOrdinal: {type: integer, minimum: 1}
        latestRetryJobId: {$ref: '#/components/schemas/CompactUUID'}
        latestRetryOrdinal: {type: integer, minimum: 1}
        retriedByJobIds: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CompactUUID'}}
    JobList:
      type: object
      additionalProperties: false
      required: [pagination, items]
      properties:
        pagination: {$ref: '#/components/schemas/Pagination'}
        items: {type: array, items: {$ref: '#/components/schemas/JobSummary'}}
    JobCancellationCreate:
      type: object
      additionalProperties: false
      maxProperties: 0
    EmptyCreate:
      type: object
      additionalProperties: false
      maxProperties: 0
    SafeFields:
      type: object
      additionalProperties: {oneOf: [{type: string}, {type: integer, format: int64, minimum: 0}]}
      maxProperties: 8
    JobFile:
      type: object
      additionalProperties: false
