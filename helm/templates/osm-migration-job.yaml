apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "workouts.fullname" . }}-osm-migrate-{{ .Release.Revision }}
  labels: {{- include "workouts.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-2"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: osm-migration}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: osm-migrate
          image: {{ include "workouts.image" (list . .Values.worker.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/osm-migrate]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - name: OSM_MIGRATION_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "worker.databaseSecret.name is required" .Values.worker.databaseSecret.name }}, key: {{ required "worker.osmDatabaseKey is required" .Values.worker.osmDatabaseKey }}}}
          volumeMounts:
            - {name: database-tls, mountPath: /tls/prod-db, readOnly: true}
      volumes:
        - name: database-tls
          secret:
            secretName: {{ required "worker.databaseTLSSecret is required" .Values.worker.databaseTLSSecret }}
            defaultMode: 0440
