{{- if .Values.ingress.enabled }}
{{- $primaryHost := required "ingress.host is required" .Values.ingress.host }}
{{- $hosts := concat (list $primaryHost) .Values.ingress.additionalHosts }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "workouts.fullname" . }}
  labels: {{- include "workouts.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
      {{- range $hosts }}
        - {{ . }}
      {{- end }}
      secretName: {{ required "ingress.tlsSecretName is required" .Values.ingress.tlsSecretName }}
  rules:
  {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ include "workouts.fullname" $ }}-api, port: {name: http}}}
          - path: /swagger
            pathType: Prefix
            backend: {service: {name: {{ include "workouts.fullname" $ }}-api, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ include "workouts.fullname" $ }}-ui, port: {name: http}}}
  {{- end }}
{{- end }}
