{{- if .Values.api.roleProvisioning.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "workouts.fullname" . }}-provision-roles-{{ .Release.Revision }}
  labels: {{- include "workouts.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: role-provisioning}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: provision-roles
          image: {{ include "workouts.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/provision-roles]
          securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - name: ROLE_PROVISIONING_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "api.roleProvisioning.secretName is required" .Values.api.roleProvisioning.secretName }}, key: {{ required "api.roleProvisioning.databaseKey is required" .Values.api.roleProvisioning.databaseKey }}}}
{{- end }}
