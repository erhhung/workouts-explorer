apiVersion: v1
kind: Service
metadata:
  name: {{ include "workouts.fullname" . }}-ui
  labels: {{- include "workouts.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: workouts-explorer-tiles
  labels: {{- include "workouts.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: tiles}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workouts.fullname" . }}-api
  labels: {{- include "workouts.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: 80, targetPort: http}]
