apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workouts.fullname" . }}-ui
  labels: {{- include "workouts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ui}
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ui
          image: {{ include "workouts.image" (list . .Values.ui.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
          resources: {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - {name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "workouts.fullname" . }}-ui-nginx
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
{{- if gt (int .Values.worker.accountFileConcurrency) (int .Values.worker.globalFileConcurrency) }}
{{- fail "worker.accountFileConcurrency must not exceed worker.globalFileConcurrency" }}
{{- end }}
{{- $syncClock := now }}
{{- $syncPollDeadline := mustDateModify .Values.worker.autoSyncPollInterval $syncClock }}
{{- $schedulerLeaseDeadline := mustDateModify .Values.worker.schedulerLeaseDuration $syncClock }}
{{- if not ($schedulerLeaseDeadline.After $syncPollDeadline) }}
{{- fail "worker.schedulerLeaseDuration must exceed worker.autoSyncPollInterval" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workouts.fullname" . }}-api
  labels: {{- include "workouts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ include "workouts.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          envFrom: [{configMapRef: {name: {{ include "workouts.fullname" . }}-api}}]
          env:
            - name: API_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "api.databaseSecret.name is required" .Values.api.databaseSecret.name }}, key: {{ .Values.api.databaseSecret.key }}}}
            - name: RATE_LIMIT_KEY
              valueFrom: {secretKeyRef: {name: {{ required "api.securitySecret.name is required" .Values.api.securitySecret.name }}, key: {{ .Values.api.securitySecret.rateLimitKey }}}}
            {{- if .Values.api.coverageDiagnostics.enabled }}
            # Temporary shared OSM credential; replace after issuing a dedicated reader client certificate.
            - name: API_OSM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "api.databaseSecret.name is required" .Values.api.databaseSecret.name }}, key: {{ required "api.coverageDiagnostics.osmDatabaseKey is required" .Values.api.coverageDiagnostics.osmDatabaseKey }}}}
            {{- end }}
            - {name: SSL_CERT_FILE, value: /var/run/secrets/workouts-trust/ca.crt}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: source-keyring, mountPath: /var/run/secrets/workouts-source, readOnly: true}
            - {name: trusted-ca, mountPath: /var/run/secrets/workouts-trust, readOnly: true}
            {{- if .Values.api.coverageDiagnostics.enabled }}
            - {name: diagnostics-database-tls, mountPath: /tls/prod-db, readOnly: true}
            {{- end }}
          {{- if not .Values.api.smtp.allowInsecureLocal }}
            - {name: smtp-password, mountPath: /var/run/secrets/workouts-smtp/password, subPath: password, readOnly: true}
          {{- end }}
      volumes:
        - name: source-keyring
          secret:
            secretName: {{ required "sources.keyringSecret.name is required" .Values.sources.keyringSecret.name }}
            defaultMode: 0440
            items: [{key: {{ required "sources.keyringSecret.key is required" .Values.sources.keyringSecret.key }}, path: keyring.json}]
        - name: trusted-ca
          secret:
            secretName: {{ required "api.trustedCASecret.name is required" .Values.api.trustedCASecret.name }}
            defaultMode: 0440
            items: [{key: {{ required "api.trustedCASecret.key is required" .Values.api.trustedCASecret.key }}, path: ca.crt}]
        {{- if .Values.api.coverageDiagnostics.enabled }}
        - name: diagnostics-database-tls
          secret:
            secretName: {{ required "api.coverageDiagnostics.databaseTLSSecret is required" .Values.api.coverageDiagnostics.databaseTLSSecret }}
            defaultMode: 0440
        {{- end }}
      {{- if not .Values.api.smtp.allowInsecureLocal }}
        - name: smtp-password
          secret:
            secretName: {{ required "api.securitySecret.name is required" .Values.api.securitySecret.name }}
            defaultMode: 0440
            items: [{key: {{ .Values.api.securitySecret.smtpPasswordKey }}, path: password}]
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workouts.fullname" . }}-coverage-worker
  labels: {{- include "workouts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.coverageWorker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: coverage-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: coverage-worker}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: coverage-worker
          image: {{ include "workouts.image" (list . .Values.coverageWorker.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/coverage-worker]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - {name: LOG_FORMAT, value: {{ .Values.logging.format | quote }} }
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }}}
            - {name: COVERAGE_WORKER_POLL_INTERVAL, value: {{ .Values.coverageWorker.pollInterval | quote }}}
            - {name: COVERAGE_WORKER_ADMISSION_INTERVAL, value: {{ .Values.coverageWorker.admissionInterval | quote }}}
            - {name: COVERAGE_WORKER_LEASE_DURATION, value: {{ .Values.coverageWorker.leaseDuration | quote }}}
            - {name: COVERAGE_WORKER_HEARTBEAT_INTERVAL, value: {{ .Values.coverageWorker.heartbeatInterval | quote }}}
            - {name: COVERAGE_WORKER_ROUTE_TIMEOUT, value: {{ .Values.coverageWorker.routeTimeout | quote }}}
            - {name: COVERAGE_RECONCILIATION_POLL_INTERVAL, value: {{ .Values.coverageWorker.reconciliationPollInterval | quote }}}
            - {name: COVERAGE_RECONCILIATION_SCAN_INTERVAL, value: {{ .Values.coverageWorker.reconciliationScanInterval | quote }}}
            - {name: COVERAGE_RECONCILIATION_PAGE_SIZE, value: {{ .Values.coverageWorker.reconciliationPageSize | quote }}}
            - {name: COVERAGE_MIN_TRAVERSAL_METERS, value: {{ .Values.worker.coverageMinTraversalMeters | quote }}}
            - name: COVERAGE_WORKER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "coverageWorker.databaseSecret.name is required" .Values.coverageWorker.databaseSecret.name }}, key: {{ required "coverageWorker.databaseSecret.key is required" .Values.coverageWorker.databaseSecret.key }}}}
            - name: COVERAGE_WORKER_OSM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "coverageWorker.databaseSecret.name is required" .Values.coverageWorker.databaseSecret.name }}, key: {{ required "coverageWorker.osmDatabaseKey is required" .Values.coverageWorker.osmDatabaseKey }}}}
          ports: [{name: health, containerPort: 8082}]
          livenessProbe: {httpGet: {path: /health/live, port: health}}
          readinessProbe: {httpGet: {path: /health/ready, port: health}}
          resources: {{- toYaml .Values.coverageWorker.resources | nindent 12 }}
          volumeMounts:
            - {name: database-tls, mountPath: /tls/prod-db, readOnly: true}
      volumes:
        - name: database-tls
          secret:
            secretName: {{ required "coverageWorker.databaseTLSSecret is required" .Values.coverageWorker.databaseTLSSecret }}
            defaultMode: 0440
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workouts.fullname" . }}-worker
  labels: {{- include "workouts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        {{- if .Values.sources.nfs.enabled }}
        supplementalGroups: [{{ .Values.sources.nfs.supplementalGroup }}]
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: {{ include "workouts.image" (list . .Values.worker.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          env:
            - {name: LOG_FORMAT, value: {{ .Values.logging.format | quote }} }
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }}}
            - {name: SOURCE_KEYRING_FILE, value: /var/run/secrets/workouts-source/keyring.json}
            - {name: LOCAL_SOURCE_ROOTS, value: {{ join "," .Values.sources.localRoots | quote }}}
            - {name: WORKER_FILE_CONCURRENCY, value: {{ .Values.worker.fileConcurrency | quote }}}
            - {name: ACCOUNT_FILE_CONCURRENCY, value: {{ .Values.worker.accountFileConcurrency | quote }}}
            - {name: GLOBAL_FILE_CONCURRENCY, value: {{ .Values.worker.globalFileConcurrency | quote }}}
            - {name: AUTO_SYNC_INTERVAL, value: {{ .Values.worker.autoSyncInterval | quote }}}
            - {name: AUTO_SYNC_POLL_INTERVAL, value: {{ .Values.worker.autoSyncPollInterval | quote }}}
            - {name: AUTO_SYNC_STALE_DAYS, value: {{ .Values.worker.autoSyncStaleDays | quote }}}
            - {name: SCHEDULER_LEASE_DURATION, value: {{ .Values.worker.schedulerLeaseDuration | quote }}}
            - {name: COVERAGE_MIN_TRAVERSAL_METERS, value: {{ .Values.worker.coverageMinTraversalMeters | quote }}}
            - {name: WORKER_STAGING_ROOT, value: {{ .Values.worker.staging.root | quote }}}
            - {name: OSM_AUTO_ADD_REGIONS, value: {{ .Values.osm.autoAddRegions | quote }}}
            - {name: OSM_MAX_AUTO_DOWNLOAD_BYTES, value: {{ .Values.osm.maxAutoDownloadBytes | float64 | printf "%.0f" | quote }}}
            - {name: OSM_DATA_PROVIDERS_JSON, value: {{ mustToJson .Values.osm.dataProviders | quote }}}
            - {name: OSM_REGIONS_JSON, value: {{ mustToJson .Values.osm.regions | quote }}}
            - name: WORKER_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "worker.databaseSecret.name is required" .Values.worker.databaseSecret.name }}, key: {{ .Values.worker.databaseSecret.key }}}}
            - name: OSM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "worker.databaseSecret.name is required" .Values.worker.databaseSecret.name }}, key: {{ required "worker.osmDatabaseKey is required" .Values.worker.osmDatabaseKey }}}}
          ports: [{name: health, containerPort: 8081}]
          livenessProbe: {httpGet: {path: /health/live, port: health}}
          readinessProbe: {httpGet: {path: /health/ready, port: health}}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: source-keyring, mountPath: /var/run/secrets/workouts-source, readOnly: true}
            - {name: staging, mountPath: {{ .Values.worker.staging.root }}}
            - {name: database-tls, mountPath: /tls/prod-db, readOnly: true}
            {{- if .Values.sources.nfs.enabled }}
            - {name: local-sources, mountPath: {{ .Values.sources.nfs.mountPath }}, readOnly: true}
            {{- end }}
      volumes:
        - name: staging
          emptyDir:
            sizeLimit: {{ .Values.worker.staging.sizeLimit }}
        - name: source-keyring
          secret:
            secretName: {{ required "sources.keyringSecret.name is required" .Values.sources.keyringSecret.name }}
            defaultMode: 0440
            items: [{key: {{ required "sources.keyringSecret.key is required" .Values.sources.keyringSecret.key }}, path: keyring.json}]
        - name: database-tls
          secret:
            secretName: {{ required "worker.databaseTLSSecret is required" .Values.worker.databaseTLSSecret }}
            defaultMode: 0440
        {{- if .Values.sources.nfs.enabled }}
        - name: local-sources
          nfs:
            server: {{ required "sources.nfs.server is required when NFS is enabled" .Values.sources.nfs.server }}
            path: {{ required "sources.nfs.path is required when NFS is enabled" .Values.sources.nfs.path }}
            readOnly: true
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workouts-explorer-tiles
  labels: {{- include "workouts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.tileServer.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: tiles}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: tiles}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/tile-server-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: martin
          image: {{ .Values.tileServer.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          args: [--config, /etc/martin/config.yaml]
          env:
            - name: MARTIN_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ required "tileServer.databaseSecret.name is required" .Values.tileServer.databaseSecret.name }}, key: {{ required "tileServer.databaseSecret.key is required" .Values.tileServer.databaseSecret.key }}}}
          ports: [{name: http, containerPort: 3000}]
          livenessProbe: {httpGet: {path: /health, port: http}}
          readinessProbe: {httpGet: {path: /health, port: http}}
          resources: {{- toYaml .Values.tileServer.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/martin, readOnly: true}
      volumes:
        - name: config
          configMap: {name: workouts-explorer-tiles}
