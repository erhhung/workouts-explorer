image:
  registry: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  tag: "0.1.0"

ui:
  image: workouts-ui
  replicas: 1
  resources: {}

api:
  image: workouts-api
  replicas: 1
  publicUrl: https://localhost
  databaseSecret:
    name: workouts-explorer-database
    key: apiDatabaseUrl
  migrationDatabaseKey: migrationDatabaseUrl
  roleProvisioning:
    enabled: false
    secretName: workouts-explorer-role-provisioning
    databaseKey: databaseUrl
  securitySecret:
    name: workouts-explorer-security
    rateLimitKey: rateLimitKey
    smtpPasswordKey: smtpPassword
  passwordMinimumLength: 12
  sessionLifetime: 2h
  pageSizeMaximum: 100
  trustedProxyCidrs: ""
  localDevelopment: false
  smtp:
    address: smtp.example.invalid:587
    username: workouts-explorer
    fromAddress: workouts@example.invalid
    allowInsecureLocal: false
  bootstrap:
    enabled: false
    secretName: workouts-explorer-bootstrap-admin
    usernameKey: username
    emailKey: email
    passwordKey: password
    databaseKey: migrationDatabaseUrl
  publicConfig:
    pollingIntervalSeconds: 30
    mapFitPaddingPixels: 48
    baseMaps:
      styleFamilies:
        - id: local-placeholder
          label: Local placeholder
          styles:
            light: https://maps.example.invalid/styles/light.json
            dark: https://maps.example.invalid/styles/dark.json
          attribution:
            text: Base map not configured
            links: []
          resourceOrigins:
            - https://maps.example.invalid
      fallbackFamilyId: local-placeholder
      workoutTypeMappings: []
  resources: {}

# MapTiler style URLs may contain a browser-restricted public key. Stadia can
# use domain authentication. Put either provider's HTTPS origins in each
# family's resourceOrigins; never put private credentials in this file.
pgTileserv:
  image: docker.io/pramsey/pg_tileserv:20250131@sha256:e390325edd16061a4486142f08c18ee12fa22f9c5ab72928c9b36e6f79ed84be
  replicas: 1
  databaseSecret:
    name: workouts-explorer-database
    key: tilesDatabaseUrl
  resources: {}

worker:
  image: workouts-worker
  replicas: 1
  databaseSecret:
    name: workouts-explorer-database
    key: workerDatabaseUrl
  fileConcurrency: 2
  accountFileConcurrency: 2
  globalFileConcurrency: 4
  autoSyncInterval: 24h
  autoSyncPollInterval: 30s
  autoSyncStaleDays: 3
  schedulerLeaseDuration: 2m
  staging:
    root: /var/lib/workouts/staging
    sizeLimit: 2Gi
  resources: {}

sources:
  keyringSecret:
    name: workouts-explorer-source-encryption
    key: keyring.json
  localRoots:
    - /data/workouts
  nfs:
    enabled: false
    server: ""
    path: ""
    mountPath: /data/workouts
    supplementalGroup: 1000

otel:
  endpoint: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tlsSecretName: workouts-explorer-ingress-tls
  certificateSecretName: workouts-explorer-ingress-tls
  mailpit:
    enabled: false
    externalName: mailpit.mailpit.svc.cluster.local
    port: 8025
