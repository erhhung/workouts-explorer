image:
  registry: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  tag: "0.1.0"

logging:
  format: json

ui:
  image: workouts-ui
  replicas: 1
  resources: {}

api:
  image: workouts-api
  replicas: 1
  publicUrl: https://localhost
  browserSigninOrigins: []
  databaseSecret:
    name: workouts-explorer-database
    key: apiDatabaseUrl
  migrationDatabaseKey: migrationDatabaseUrl
  roleProvisioning:
    enabled: false
    secretName: workouts-explorer-role-provisioning
    databaseKey: databaseUrl
  securitySecret:
    name: workouts-explorer-security
    rateLimitKey: rateLimitKey
    smtpPasswordKey: smtpPassword
  trustedCASecret:
    name: workouts-explorer-database-tls
    key: ca.crt
  passwordMinimumLength: 12
  sessionLifetime: 6h
  pageSizeMaximum: 100
  trustedProxyCidrs: ""
  localDevelopment: false
  coverageDiagnostics:
    enabled: false
    timeout: 120s
    concurrency: 1
    osmDatabaseKey: osmDatabaseUrl
    databaseTLSSecret: workouts-explorer-database-tls
    motorLaneWidthMeters: 3
    bicycleLaneWidthMeters: 1.5
    parkingLaneWidthMeters: 2.1
    sidewalkSetbackMeters: 3
    directionalDriftMeters: 7
    deadEndEndpointAllowanceMeters: 3
  smtp:
    address: smtp.example.invalid:587
    username: workouts-explorer
    fromAddress: workouts@example.invalid
    allowInsecureLocal: false
  bootstrap:
    enabled: false
    rotateExistingPassword: false
    secretName: workouts-explorer-bootstrap-admin
    usernameKey: username
    emailKey: email
    passwordKey: password
    databaseKey: migrationDatabaseUrl
  publicConfig:
    pollingIntervalSeconds: 30
    mapFitPaddingPixels: 48
    baseMaps:
      styleFamilies:
        - id: local-placeholder
          label: Local placeholder
          styles:
            light: https://maps.example.invalid/styles/light.json
            dark: https://maps.example.invalid/styles/dark.json
          attribution:
            text: Base map not configured
            links: []
          resourceOrigins:
            - https://maps.example.invalid
      fallbackFamilyId: local-placeholder
      workoutTypeMappings: []
  resources: {}

# MapTiler style URLs may contain a browser-restricted public key. Stadia can
# use domain authentication. Put either provider's HTTPS origins in each
# family's resourceOrigins; never put private credentials in this file.
tileServer:
  image: ghcr.io/maplibre/martin:1.15.0@sha256:84f406ac96839aad3ea06ddaa68ef7617ed55305c21038c182d59f100e48dd6d
  replicas: 1
  databaseSecret:
    name: workouts-explorer-database
    key: tilesDatabaseUrl
  resources: {}

worker:
  image: workouts-worker
  replicas: 1
  databaseSecret:
    name: workouts-explorer-database
    key: workerDatabaseUrl
  osmDatabaseKey: osmDatabaseUrl
  databaseTLSSecret: workouts-explorer-database-tls
  fileConcurrency: 2
  accountFileConcurrency: 2
  globalFileConcurrency: 4
  autoSyncInterval: 24h
  autoSyncPollInterval: 30s
  autoSyncStaleDays: 3
  schedulerLeaseDuration: 2m
  coverageMinTraversalMeters: 5
  staging:
    root: /var/lib/workouts/staging
    sizeLimit: 2Gi
  resources: {}

osm:
  autoAddRegions: false
  maxAutoDownloadBytes: 1073741824
  dataProviders:
    - geofabrik
  regions:
    - geofabrik:norcal
  timezoneBoundaries:
    enabled: true
    release: 2026c
    sourceUrl: https://github.com/evansiroky/timezone-boundary-builder/releases/download/2026c/timezones.geojson.zip
    sha256: 7d3f0c5a33b6acd891335c0ad5ba767736b6914cb1a1d68c71921c17ce358948

sources:
  keyringSecret:
    name: workouts-explorer-source-encryption
    key: keyring.json
  localRoots:
    - /data/workouts
  nfs:
    enabled: false
    server: ""
    path: ""
    mountPath: /data/workouts
    supplementalGroup: 1000

otel:
  endpoint: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  additionalHosts: []
  tlsSecretName: workouts-explorer-ingress-tls
  certificateSecretName: workouts-explorer-ingress-tls
