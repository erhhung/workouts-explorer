apiVersion: v1
kind: Namespace
metadata:
  name: workouts-acceptance
  labels:
    workouts-disposable: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acceptance-postgres
  namespace: workouts-acceptance
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: acceptance-postgres}
  template:
    metadata:
      labels: {app: acceptance-postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgis/postgis:18-3.6
          env:
            - {name: POSTGRES_PASSWORD, value: acceptance-only-postgres}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
          args: [-c, shared_buffers=128MB, -c, max_connections=80, -c, track_io_timing=on, -c, shared_preload_libraries=pg_stat_statements]
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres]}
            initialDelaySeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: acceptance-postgres
  namespace: workouts-acceptance
spec:
  selector: {app: acceptance-postgres}
  ports: [{port: 5432, targetPort: 5432}]
