apiVersion: v1
kind: ConfigMap
metadata: {name: acceptance-telemetry, namespace: workouts-acceptance}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      nop: {}
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          exporters: [nop]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: acceptance-telemetry, namespace: workouts-acceptance}
spec:
  replicas: 1
  selector:
    matchLabels: {app: acceptance-telemetry}
  template:
    metadata:
      labels: {app: acceptance-telemetry}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.146.1
          args: [--config=/etc/otel/config.yaml]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          ports: [{containerPort: 4318}, {containerPort: 8889}]
          volumeMounts:
            - {name: config, mountPath: /etc/otel, readOnly: true}
      volumes:
        - name: config
          configMap: {name: acceptance-telemetry}
---
apiVersion: v1
kind: Service
metadata: {name: acceptance-telemetry, namespace: workouts-acceptance}
spec:
  selector: {app: acceptance-telemetry}
  ports: [{name: otlp, port: 4318}, {name: metrics, port: 8889}]
