apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  workouts-otel.server: |
    otel-gateway-collector.observability.svc.cluster.local:1053 {
        errors
        forward . 10.43.0.10
        cache 30
